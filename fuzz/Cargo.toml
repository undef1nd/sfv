[package]
name = "sfv-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4.1", features = ["derive"] }
libfuzzer-sys = "0.4"

[dependencies.sfv]
path = ".."
features = ["arbitrary"]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip_item"
path = "fuzz_targets/roundtrip_item.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip_list"
path = "fuzz_targets/roundtrip_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip_dictionary"
path = "fuzz_targets/roundtrip_dictionary.rs"
test = false
doc = false
bench = false
