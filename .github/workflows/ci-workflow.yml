name: CI

on:
  pull_request:
    branches:
      - main
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  stable:
    name: Check, clippy, and test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: cargo check --all-targets
      - run: cargo check --all-targets --no-default-features
      - run: cargo check --all-targets --all-features
      - run: cargo clippy --all-targets --all-features
      - run: cargo test
      - run: cargo run --example priority

  msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.95
          override: true
      - name: Build with MSRV
        run: cargo build

  nightly:
    name: Format and fuzz check (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: rustfmt
          override: true
      - run: cargo fmt -- --check
      - run: cargo install cargo-fuzz
      - run: cargo fuzz check
